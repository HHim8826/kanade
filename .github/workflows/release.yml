# Builds Kanade for Linux and publishes a release when a version tag (v1.2.3) is pushed, once CI
# (ci.yml) passes on the commit: the run its push to main started (waited for while it goes), else
# one of its own (a commit not pushed to main, or whose run was cancelled or failed). Run by hand
# (workflow_dispatch), it builds the same files as an artifact without releasing them.
#
# Release files, which scripts/kanade.sh downloads:
#   kanade-linux-amd64.tar.gz, kanade-linux-arm64.tar.gz   the program
#   SHA256SUMS                                              their checksums and the script's
#   VERSION                                                 the tag, for update checks
#   kanade.sh                                               the install and manage script
# Its notes are the titles of the commits since the version before (scripts/release-notes.sh): a
# generated list names pull requests only, and changes come straight to main (review #260).
# Each job has only the permissions it needs, and actions are pinned to commits (review #263).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # passed: CI ran on this commit when it was pushed to main, and passed.
  checked:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.find.outputs.passed }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 90); do # up to half an hour: a run takes about five minutes
            states=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '[.workflow_runs[] | if .status == "completed" then .conclusion else "running" end] | join(" ")')
            echo "CI on $GITHUB_SHA: ${states:-none}"
            case " $states " in
              *" success "*) echo "passed=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              *" running "*) sleep 20 ;;
              *) break ;;
            esac
          done
          echo "passed=false" >> "$GITHUB_OUTPUT"

  ci:
    needs: checked
    if: needs.checked.outputs.passed != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: [checked, ci]
    if: ${{ !cancelled() && needs.checked.result == 'success' && (needs.checked.outputs.passed == 'true' || needs.ci.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags, for the notes
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build
        working-directory: server
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          mkdir -p ../dist
          for arch in amd64 arm64; do
            out="../dist/kanade-linux-$arch"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$out/kanade" ./cmd/kanade
            cp ../README.md ../LICENSE "$out/"
            tar -C "$out" -czf "../dist/kanade-linux-$arch.tar.gz" kanade README.md LICENSE
            rm -rf "$out"
          done
          cp ../scripts/kanade.sh ../dist/
          echo "$version" > ../dist/VERSION
          cd ../dist && sha256sum kanade-linux-*.tar.gz kanade.sh > SHA256SUMS && cat SHA256SUMS

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre=(--prerelease) # v1.2.3-rc1 and the like
          scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --title "Kanade $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" "${pre[@]}"

      - name: Artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kanade-${{ github.sha }}
          path: dist/
