# Checks every push to main and every pull request; a release runs it (workflow_call) on a commit
# it has not passed on yet.
#   go:      gofmt, go vet, and the tests with the race detector, with aria2 and FFmpeg installed
#            so the download and conversion tests run instead of skipping
#   web:     the web client (no build step): modules parse, imports exist and are used
#   scripts: the install and release scripts (shellcheck) and the workflows (actionlint)
# Actions are pinned to commits, their versions beside them; Dependabot proposes newer ones (review #263).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch replaces a run still going. Called from a release, the group
# is the release's (github.workflow is the caller's name), apart from these.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: aria2 and FFmpeg for the tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq aria2 ffmpeg

      - name: gofmt
        working-directory: server
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-ed: $unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: server
        run: go vet ./...

      - name: Tests (race detector)
        working-directory: server
        env:
          KANADE_ARIA2: /usr/bin/aria2c
        run: go test -race -count=1 ./...

  web:
    name: Web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node server/scripts/check-web.mjs

  scripts:
    name: Scripts and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck -S warning scripts/kanade.sh scripts/release-notes.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false

      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
